server {
    listen 80;
    resolver 127.0.0.11 valid=5s ipv6=off;
    location /media/ {
        set $media_gateway http://media-gateway:8080;
        proxy_pass $media_gateway$request_uri;
    }
    location / {
        set $assets_gateway http://assets-gateway:8080;
        proxy_pass $assets_gateway$request_uri;
    }
}
