{{- $redis := eq .Values.state.mode "redis" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cdn-manager.fullname" . }}
  labels:
    {{- include "cdn-manager.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "cdn-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cdn-manager.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.podScrape.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      {{- if $redis }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "cdn-manager.selectorLabels" . | nindent 18 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.podSecurityContext.runAsUser }}
        runAsGroup: {{ .Values.podSecurityContext.runAsGroup }}
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: CDN_MANAGER_CONFIG
              value: /etc/cdn-manager/config.json
            - name: CDN_MANAGER_STATE_MODE
              value: {{ .Values.state.mode | quote }}
            {{- if $redis }}
            - name: CDN_MANAGER_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret must supply the Redis connection URL" .Values.existingSecret | quote }}
                  key: {{ required "state.redisSecretKey is required with Redis" .Values.state.redisSecretKey | quote }}
            - name: CDN_MANAGER_REDIS_PREFIX
              value: {{ include "cdn-manager.redisPrefix" . | quote }}
            - name: CDN_MANAGER_SPOOL_DIR
              value: /var/lib/cdn-manager
            {{- else }}
            - name: CDN_MANAGER_STATE_DIR
              value: /var/lib/cdn-manager
            {{- end }}
            - name: CDN_MANAGER_LISTEN
              value: ":8080"
            - name: CDN_MANAGER_INTERNAL_LISTEN
              value: ":9090"
            - name: GOMEMLIMIT
              value: {{ .Values.goMemLimit | quote }}
            {{- with .Values.config.auth.mcpBrokerKeyEnv }}
            - name: {{ . | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret | quote }}
                  key: {{ . | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ required "existingSecret names the Secret that supplies OIDC and S3 credentials" .Values.existingSecret }}
          ports:
            - name: web
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          startupProbe:
            httpGet:
              path: /livez
              port: metrics
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/cdn-manager
              readOnly: true
            - name: state
              mountPath: /var/lib/cdn-manager
      volumes:
        - name: config
          configMap:
            name: {{ include "cdn-manager.fullname" . }}
        - name: state
          {{- if $redis }}
          emptyDir:
            sizeLimit: {{ .Values.state.spoolSize | quote }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "cdn-manager.fullname" .) }}
          {{- end }}
