{{- if .Values.valkey.enabled -}}
{{- if ne .Values.state.mode "redis" -}}
{{- fail "valkey.enabled requires state.mode=redis" -}}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cdn-manager.valkeyName" . }}
data:
  valkey.conf: |
    port 6379
    dir /data
    save ""
    appendonly yes
    appendfsync always
    aof-load-truncated no
    maxmemory {{ .Values.valkey.maxmemory }}
    maxmemory-policy noeviction
    aclfile /etc/valkey/acl/users.acl
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cdn-manager.valkeyName" . }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: cdn-manager-valkey
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cdn-manager.valkeyName" . }}
spec:
  serviceName: {{ include "cdn-manager.valkeyName" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cdn-manager-valkey
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cdn-manager-valkey
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ .Values.valkey | toJson | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: {{ .Values.valkey.image | quote }}
          command: ["valkey-server", "/etc/valkey/config/valkey.conf"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
          startupProbe:
            tcpSocket:
              port: redis
            periodSeconds: 2
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/valkey/config
              readOnly: true
            - name: acl
              mountPath: /etc/valkey/acl
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: {{ include "cdn-manager.valkeyName" . }}
        - name: acl
          secret:
            secretName: {{ required "valkey.existingSecret must contain a users.acl file" .Values.valkey.existingSecret | quote }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if ne .Values.valkey.storageClassName nil }}
        storageClassName: {{ .Values.valkey.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.valkey.storageSize }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cdn-manager.valkeyName" . }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cdn-manager-valkey
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "cdn-manager.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
