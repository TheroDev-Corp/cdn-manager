replicaCount: 2
state:
  mode: redis
  # The Secret key in existingSecret that contains the Redis connection URL.
  redisSecretKey: CDN_MANAGER_REDIS_URL
  # Empty derives the namespace from the Helm release name and namespace.
  redisPrefix: ""
  # Maximum temporary disk use for spooled transfers in each Redis-mode pod.
  spoolSize: 320Mi

image:
  repository: ghcr.io/therodev-corp/cdn-manager
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# This Secret supplies OIDC, S3, Redis, and optional MCP broker credentials.
existingSecret: cdn-manager-credentials
config:
  auth:
    publicUrl: https://manager.example.com
    oidcIssuer: https://identity.example.com/application/o/cdn-web/
    oidcClientId: example-web-client
    oidcClientSecretEnv: OIDC_WEB_CLIENT_SECRET
    mcpIssuer: https://identity.example.com/application/o/cdn-mcp/
    mcpAudience: example-mcp-resource
    mcpScopes: [read, write, delete]
    sessionTtl: 8h
  sources:
    - id: example
      label: Example source
      endpoint: https://storage.example.com
      region: example-region
      buckets: [assets]
      pathStyle: true
      cdnUrl: https://files.example.com/{key}
      accessKeyEnv: EXAMPLE_S3_ACCESS_KEY
      secretKeyEnv: EXAMPLE_S3_SECRET_KEY
      roles:
        viewer: [example-viewers]
        editor: [example-editors]
        admin: [example-admins]
      capabilities:
        multipart: true

persistence:
  # Only used with state.mode=file and replicaCount=1.
  existingClaim: ""
  size: 2Gi
  # Null uses the cluster default. An empty string disables dynamic provisioning.
  storageClassName: null
  accessMode: ReadWriteOnce
  keep: true

podSecurityContext:
  # Keep the previous UID and GIDs when reusing a claim with state owned by that user.
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534

service:
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: manager.example.com
  tlsSecretName: ""

serviceMonitor:
  enabled: false
  additionalLabels: {}
  interval: 30s
  scrapeTimeout: 10s

# For collectors that discover targets using prometheus.io Pod annotations.
podScrape:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 96Mi
    ephemeral-storage: 320Mi
  limits:
    cpu: "1"
    memory: 256Mi
    ephemeral-storage: 512Mi
goMemLimit: 160MiB

# Optional single persistent Valkey instance. It does not provide datastore HA.
valkey:
  enabled: false
  image: valkey/valkey:9-alpine@sha256:c8e2d17498838af5d91e12eb7c11220b3434a7b7131a333e3af52ad5e0b80882
  # Secret with one users.acl file. The manager still needs its Redis connection URL.
  existingSecret: ""
  storageClassName: null
  storageSize: 1Gi
  maxmemory: 32mb
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
