services:
  manager:
    build: .
    network_mode: service:issuer
    depends_on:
      garage:
        condition: service_healthy
      issuer:
        condition: service_healthy
    environment:
      CDN_MANAGER_CONFIG: /demo/config.json
      CDN_MANAGER_STATE_DIR: /var/lib/cdn-manager
      GOMEMLIMIT: 40MiB
      DEMO_OIDC_SECRET: only-for-local-demo
      DEMO_ACCESS_KEY: GKad0d778308314ea0e87d5af7
      DEMO_SECRET_KEY: 8df1c8a56d450b93faef06ee6930aa05f6fbe14d862762ae4cbcee67acca89b0c
    volumes:
      - ./e2e/demo/config.json:/demo/config.json:ro
      - manager-state:/var/lib/cdn-manager
    read_only: true
    mem_limit: 64m
    init: true

  # The manager shares this network namespace so the issuer URL is identical
  # in discovery, in the browser, and at the manager's back-channel endpoints.
  issuer:
    image: oven/bun:1.4.2
    entrypoint: ["bun", "/demo/issuer.mjs"]
    init: true
    environment:
      DEMO_ISSUER_HOST: 0.0.0.0
    volumes:
      - ./e2e/demo/issuer.mjs:/demo/issuer.mjs:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:5556:5556"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:5556/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 1s
      timeout: 5s
      retries: 20

  garage:
    build:
      context: ./e2e/demo
      dockerfile: Dockerfile.garage
    init: true
    volumes:
      - ./e2e/demo/garage.toml:/etc/garage.toml:ro
      - garage-state:/var/lib/garage
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "test -e /run/demo-garage-ready"]
      interval: 1s
      timeout: 5s
      retries: 30

  assets-gateway: &gateway
    image: ghcr.io/nginx/nginx-s3-gateway/nginx-oss-s3-gateway:unprivileged-oss-20261123
    depends_on:
      garage:
        condition: service_healthy
    environment: &gateway-environment
      AWS_ACCESS_KEY_ID: GKb5c507b83b8b5bd04cf89337
      AWS_SECRET_ACCESS_KEY: 31f2e4d39e715bf83c1328f1856e48f78df9d1158e7e409ee8f02a9326769bbd0
      AWS_SIGS_VERSION: "4"
      S3_SERVER: garage
      S3_SERVER_PORT: "3900"
      S3_SERVER_PROTO: http
      S3_REGION: example
      S3_STYLE: path
      S3_BUCKET_NAME: assets
      ALLOW_DIRECTORY_LIST: "false"
      PROXY_CACHE_MAX_SIZE: 100m
      PROXY_CACHE_SLICE_SIZE: 1m
      ACCESS_LOG_CACHE_STATUS: "true"
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(curl -s --max-time 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/__demo_readiness__)\" = 404"]
      interval: 1s
      timeout: 5s
      retries: 20

  media-gateway:
    <<: *gateway
    environment:
      <<: *gateway-environment
      S3_BUCKET_NAME: videos
      STRIP_LEADING_DIRECTORY_PATH: /media

  cdn:
    image: nginx:1.28-alpine
    depends_on:
      assets-gateway:
        condition: service_healthy
      media-gateway:
        condition: service_healthy
    volumes:
      - ./e2e/demo/cdn.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8081:80"

volumes:
  garage-state:
  manager-state:
